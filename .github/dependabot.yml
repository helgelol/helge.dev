version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      # Solid 2 RC packages import each other's internals; a lone bump breaks the build.
      solid:
        patterns:
          - 'solid-js'
          - '@solidjs/*'
      updates:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
